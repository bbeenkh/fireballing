name: CD - Android

on:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/**"

jobs:
  build-and-deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/Fireballing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile/Fireballing

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write .env.prod
        run: echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Write Google Play JSON key
        run: echo '${{ secrets.GOOGLE_PLAY_JSON_KEY }}' > google-play-key.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/Fireballing/android/**/*.gradle*', 'apps/mobile/Fireballing/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build & Deploy
        run: bundle exec fastlane android deploy
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_PATH: google-play-key.json
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
