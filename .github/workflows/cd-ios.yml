name: CD - iOS

on:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/**"

jobs:
  build-and-deploy:
    name: Build & Deploy to App Store
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile/Fireballing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile/Fireballing

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Write .env.prod
        run: echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile/Fireballing/ios/Pods
          key: pods-${{ hashFiles('apps/mobile/Fireballing/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install Pods
        run: cd ios && pod install

      - name: Build & Deploy
        run: bundle exec fastlane ios deploy
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
