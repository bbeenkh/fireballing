pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'com.myapp.fireballing'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// 서드파티 라이브러리의 minSdkVersion 및 androidTest 호환성 수정
gradle.afterProject { project ->
    if (project.hasProperty("android") && project.name != rootProject.name) {
        project.android {
            if (defaultConfig.minSdkVersion != null && defaultConfig.minSdkVersion.apiLevel < 24) {
                defaultConfig.minSdkVersion 24
            }
            packagingOptions {
                pickFirst '**/libc++_shared.so'
                pickFirst '**/libreactnative.so'
                pickFirst '**/libfbjni.so'
                pickFirst '**/libfolly_runtime.so'
                pickFirst '**/libglog.so'
                pickFirst '**/libhermes.so'
                pickFirst '**/libjsi.so'
                pickFirst '**/libturbomodulejsijni.so'
                pickFirst '**/libreactnativejni.so'
            }
        }
        // react-native-encrypted-storage의 androidTest는 RN 0.85와 비호환
        if (project.name == "react-native-encrypted-storage") {
            project.tasks.matching { it.name.contains("AndroidTest") }.configureEach {
                enabled = false
            }
        }
    }
}
